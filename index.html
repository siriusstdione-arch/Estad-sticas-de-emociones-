      function normalizeHexColor(hex, fallback) {
        const val = String(hex || "").trim();
        if (/^#[0-9a-fA-F]{6}$/.test(val)) return val.toLowerCase();
        if (/^#[0-9a-fA-F]{3}$/.test(val)) {
          return "#" + val[1] + val[1] + val[2] + val[2] + val[3] + val[3];
        }
        return (fallback || "#12182d").toLowerCase();
      }

      function hexToRgb(hex) {
        const clean = normalizeHexColor(hex, "#12182d").slice(1);
        return {
          r: parseInt(clean.slice(0, 2), 16),
          g: parseInt(clean.slice(2, 4), 16),
          b: parseInt(clean.slice(4, 6), 16)
        };
      }

      function rgbToHex(r, g, b) {
        const clamp = (n) => Math.max(0, Math.min(255, Math.round(n)));
        return "#" + [clamp(r), clamp(g), clamp(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
      }

      function shiftHexBrightness(hex, amount) {
        const { r, g, b } = hexToRgb(hex);
        return rgbToHex(r + amount, g + amount, b + amount);
      }

      function isLightHexColor(hex) {
        const { r, g, b } = hexToRgb(hex);
        const luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b;
        return luminance > 155;
      }

      function getThemeById(id) {
        return CARD_THEMES.find((t) => t.id === id) || CARD_THEMES[0];
      }

      function buildThemeFromCharacter(char) {
        const baseTheme = getThemeById(char && char.themeId);
        const mode = (char && char.cardColorMode) || "gradient";

        if (mode === "solid") {
          const solidHex = normalizeHexColor(char && char.solidColor, "#111625");
          const accentHex = normalizeHexColor(char && char.customAccentColor, baseTheme.accent);
          const light = isLightHexColor(solidHex);
          return {
            ...baseTheme,
            id: "solid-custom",
            isSolid: true,
            name: `Sólido (${solidHex.toUpperCase()})`,
            bgStart: solidHex,
            bgEnd: solidHex,
            surface: light ? "rgba(255, 255, 255, 0.78)" : shiftHexBrightness(solidHex, 14),
            border: light ? "rgba(15, 23, 42, 0.16)" : "rgba(255, 255, 255, 0.14)",
            accent: accentHex,
            badgeBg: light ? "rgba(15, 23, 42, 0.09)" : "rgba(255, 255, 255, 0.12)",
            badgeText: light ? "#1e293b" : "#f8fafc",
            text: light ? "#0f172a" : "#f8fafc",
            muted: light ? "#475569" : "#cbd5e1",
            glow: "rgba(139, 92, 246, 0.22)"
          };
        }

        if (mode === "custom") {
          const primaryHex = normalizeHexColor(char && char.customColor, "#161d38");
          const accentHex = normalizeHexColor(char && char.customAccentColor, "#8b5cf6");
          const secondaryHex = shiftHexBrightness(primaryHex, isLightHexColor(primaryHex) ? -22 : 22);
          const light = isLightHexColor(primaryHex);
          return {
            ...baseTheme,
            id: "custom-color",
            isSolid: false,
            name: `Personalizado (${primaryHex.toUpperCase()})`,
            bgStart: primaryHex,
            bgEnd: secondaryHex,
            surface: light ? "rgba(255, 255, 255, 0.78)" : shiftHexBrightness(primaryHex, 16),
            border: light ? "rgba(15, 23, 42, 0.16)" : "rgba(255, 255, 255, 0.15)",
            accent: accentHex,
            badgeBg: light ? "rgba(15, 23, 42, 0.09)" : "rgba(255, 255, 255, 0.14)",
            badgeText: light ? "#1e293b" : "#f8fafc",
            text: light ? "#0f172a" : "#f8fafc",
            muted: light ? "#475569" : "#cbd5e1",
            glow: "rgba(139, 92, 246, 0.25)"
          };
        }

        return { ...baseTheme, isSolid: false };
      }

      const MAX_SHARE_HASH_CHARS = 120000;

      function getBaseSharePageUrl() {
        try {
          const loc = window.location;
          if (loc && loc.origin && loc.origin !== "null") {
            return `${loc.origin}${loc.pathname}${loc.search || ""}`;
          }
          if (loc && loc.href) {
            const cleanHref = loc.href.split("#")[0];
            if (cleanHref) return cleanHref;

        } catch (_err) {
          // Respaldo seguro
        }
        return "index.html";
      }

      function serializeUtf8ToBase64Url(obj) {
        const jsonStr = JSON.stringify(obj);
        const bytes = new TextEncoder().encode(jsonStr);
        let binary = "";
        const chunkSize = 0x8000;
        for (let i = 0; i < bytes.length; i += chunkSize) {
          binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
        }
        return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      }

      function buildSharePayload(character, mediaMode) {
        const cleanChar = normalizeCharacter(character, 0);
        const mode = mediaMode || "full";
        const isDataUrl = (u) => typeof u === "string" && u.trim().toLowerCase().startsWith("data:");

        const sanitizeMedia = (url) => {
          const val = String(url || "").trim();
          if (!val) return "";
          if (mode === "urls-only" && isDataUrl(val)) return "";
          if (mode === "no-media" && isDataUrl(val)) return "";
          return val;
        };

        const sanitizeOverlays = (list) => {
          if (!Array.isArray(list)) return [];
          if (mode === "no-media") return [];
          return list
            .map((ov) => {
              const u = sanitizeMedia(ov && ov.url);
              if (!u) return null;
              return { id: ov.id, url: u, x: ov.x, y: ov.y, size: ov.size };
            })
            .filter(Boolean);
        };

        return {
          v: 10,
          name: cleanChar.name,
          title: cleanChar.title,
          position: cleanChar.position,
          description: cleanChar.description,
          spotifyUrl: cleanChar.spotifyUrl,
          spotifyTitle: cleanChar.spotifyTitle,
          spotifyArtist: cleanChar.spotifyArtist,
          spotifyCover: mode === "no-media" ? "" : sanitizeMedia(cleanChar.spotifyCover),
          themeId: cleanChar.themeId,
          cardColorMode: cleanChar.cardColorMode,
          solidColor: cleanChar.solidColor,
          customColor: cleanChar.customColor,
          customAccentColor: cleanChar.customAccentColor,
          nameFontId: cleanChar.nameFontId,
          avatarUrl: sanitizeMedia(cleanChar.avatarUrl),
          avatarPosition: cleanChar.avatarPosition,
          avatarShape: cleanChar.avatarShape,
          avatarScale: cleanChar.avatarScale,
          bannerUrl: sanitizeMedia(cleanChar.bannerUrl),
          bannerPosition: cleanChar.bannerPosition,
          bodyBgUrl: sanitizeMedia(cleanChar.bodyBgUrl),
          bodyBgPosition: cleanChar.bodyBgPosition,
          bodyBgOverlay: cleanChar.bodyBgOverlay,
          overlays: sanitizeOverlays(cleanChar.overlays),
          tipsWarnings: cleanChar.tipsWarnings,
          emotions: cleanChar.emotions.map((e) => ({
            id: e.id,
            label: e.label,
            value: e.value,
            color: e.color,
            note: e.note
          }))
        };
      }

      function encodeSharePayload(character) {
        const baseUrl = getBaseSharePageUrl();
        const fullPayload = buildSharePayload(character, "full");
        let b64 = serializeUtf8ToBase64Url(fullPayload);
        let notice = "";

        if (b64.length > MAX_SHARE_HASH_CHARS) {
          const urlsOnlyPayload = buildSharePayload(character, "urls-only");
          const urlsOnlyB64 = serializeUtf8ToBase64Url(urlsOnlyPayload);
          if (urlsOnlyB64.length <= MAX_SHARE_HASH_CHARS) {
            b64 = urlsOnlyB64;
            notice = "Enlace optimizado: se omitieron imágenes subidas en base64 muy pesadas conservando enlaces externos y todos los campos.";
          } else {
            const noMediaPayload = buildSharePayload(character, "no-media");
            b64 = serializeUtf8ToBase64Url(noMediaPayload);
            notice = "Enlace compacto: se omitieron imágenes pesadas para evitar que el enlace se corte, preservando tema, música, tips y emociones.";
          }
        }

        return { url: `${baseUrl}#share=${b64}`, length: b64.length, notice };
      }

      function decodeShareFromHash(customHash) {
        try {
          const rawHash = typeof customHash === "string" ? customHash : (window.location.hash || "");
          const hash = String(rawHash || "").trim();
          const shareIdx = hash.indexOf("#share=");
          if (shareIdx === -1) return null;
          let b64 = hash.slice(shareIdx + 7).split("&")[0].trim();
          if (!b64) return null;
          b64 = decodeURIComponent(b64).replace(/-/g, "+").replace(/_/g, "/");
          while (b64.length % 4) b64 += "=";
          const binary = atob(b64);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
          }
          const jsonStr = new TextDecoder().decode(bytes);
          const parsed = JSON.parse(jsonStr);
          if (!parsed || typeof parsed !== "object") return null;
          return normalizeCharacter({ ...parsed, id: "shared-character" }, 0);
        } catch (_err) {
          return null;
        }
      }

      function syncShareHashInAddressBar(character) {
        try {
          const encoded = encodeSharePayload(character);
          if (encoded && encoded.url && encoded.url.includes("#share=")) {
            const nextHash = "#share=" + encoded.url.split("#share=")[1];
            if (window.location.hash !== nextHash) {
              try {
                window.history.replaceState(null, "", nextHash);

      async function copyTextReliable(text, inputEl) {
        const value = String(text || "");
        if (!value) return false;

        try {
          if (navigator.clipboard && typeof navigator.clipboard.writeText === "function" && window.isSecureContext !== false) {
            await navigator.clipboard.writeText(value);
            return true;
          }
        } catch (_clipErr) {
          // Respaldo
        }

        try {
          if (inputEl && typeof inputEl.focus === "function" && typeof inputEl.select === "function") {
            inputEl.focus();
            inputEl.select();
            if (typeof inputEl.setSelectionRange === "function") {
              inputEl.setSelectionRange(0, value.length);
            }
            if (document.execCommand && document.execCommand("copy")) return true;
          }
        } catch (_inpErr) {
          // Respaldo
        }

        try {
          const ta = document.createElement("textarea");
          ta.value = value;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.top = "0";
          ta.style.left = "0";
          ta.style.width = "2px";
          ta.style.height = "2px";
          ta.style.opacity = "0.01";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          if (typeof ta.setSelectionRange === "function") {
            ta.setSelectionRange(0, value.length);
          }
          const ok = Boolean(document.execCommand && document.execCommand("copy"));
          ta.remove();
          return ok;
        } catch (_execErr) {
          return false;
        }
      }

      function parseSpotifyUrl(url) {
        const raw = String(url || "").trim();
        if (!raw) return null;
        const match = raw.match(/open\.spotify\.com\/(?:intl-[a-z]{2}\/)?(track|episode|album|playlist)\/([a-zA-Z0-9]+)/i);
        if (match) {
          const kind = match[1].toLowerCase();
          const id = match[2];
          return {
            kind,
            id,
            url: raw,
            embedUrl: `https://open.spotify.com/embed/${kind}/${id}?utm_source=generator&theme=0`
          };
        }
        const uriMatch = raw.match(/^spotify:(track|episode|album|playlist):([a-zA-Z0-9]+)$/i);
        if (uriMatch) {
          const kind = uriMatch[1].toLowerCase();
          const id = uriMatch[2];
          return {
            kind,
            id,
            url: `https://open.spotify.com/${kind}/${id}`,
            embedUrl: `https://open.spotify.com/embed/${kind}/${id}?utm_source=generator&theme=0`
          };
        }
        return { kind: "track", id: "", url: raw, embedUrl: "" };
      }

      const spotifyLookupCache = new Map();
      let lastSpotifyLookupUrl = "";

      async function lookupSpotifyMetadata(rawUrl, forceLookup) {
        const trimmed = String(rawUrl || "").trim();
        if (!trimmed) return null;
        if (!forceLookup && trimmed === lastSpotifyLookupUrl) return null;
        if (
          !/open\.spotify\.com\/(?:intl-[a-z]{2}\/)?(track|episode|album|playlist)\/[a-zA-Z0-9]+/i.test(trimmed) &&
          !/^spotify:(track|episode|album|playlist):[a-zA-Z0-9]+$/i.test(trimmed)
        ) {
          return null;
        }

        lastSpotifyLookupUrl = trimmed;
        if (spotifyLookupCache.has(trimmed)) return spotifyLookupCache.get(trimmed);

        const canonicalUrl = trimmed.startsWith("spotify:")
          ? (parseSpotifyUrl(trimmed) && parseSpotifyUrl(trimmed).url) || trimmed
          : trimmed;

        try {
          const resp = await fetch(`https://open.spotify.com/oembed?url=${encodeURIComponent(canonicalUrl)}`);
          if (!resp.ok) return null;
          const data = await resp.json();
          const parsed = {
            title: String(data && data.title ? data.title : "").trim(),
            artist: String(data && data.author_name ? `${data.author_name} • Spotify` : "Spotify").trim(),
            cover: String(data && data.thumbnail_url ? data.thumbnail_url : "").trim()
          };
          spotifyLookupCache.set(trimmed, parsed);
          return parsed;
        } catch (_err) {
          return null;
        }
      }

      function isGifMedia(src) {

      function drawRoundedRect(ctx, x, y, w, h, r) {
        const radius = Math.max(0, Math.min(r, w / 2, h / 2));
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + w, y, x + w, y + h, radius);
        ctx.arcTo(x + w, y + h, x, y + h, radius);
        ctx.arcTo(x, y + h, x, y, radius);
        ctx.arcTo(x, y, x + w, y, radius);
        ctx.closePath();
      }

      function applyAvatarShapeClip(ctx, shape, x, y, w, h) {
        ctx.beginPath();
        if (shape === "circle") {
          ctx.ellipse(x + w * 0.5, y + h * 0.5, w * 0.5, h * 0.5, 0, 0, Math.PI * 2);
          ctx.closePath();
          return;
        }
        if (shape === "heart") {
          const cx = x + w * 0.5;
          const topDipY = y + h * 0.17;
          ctx.moveTo(cx, y + h * 0.98);
          ctx.bezierCurveTo(x + w * 0.03, y + h * 0.72, x - w * 0.02, y + h * 0.28, x + w * 0.16, y + h * 0.05);
          ctx.bezierCurveTo(x + w * 0.30, y - h * 0.02, x + w * 0.44, y + h * 0.05, cx, topDipY);
          ctx.bezierCurveTo(x + w * 0.56, y + h * 0.05, x + w * 0.70, y - h * 0.02, x + w * 0.84, y + h * 0.05);
          ctx.bezierCurveTo(x + w * 1.02, y + h * 0.28, x + w * 0.97, y + h * 0.72, cx, y + h * 0.98);
          ctx.closePath();
          return;
        }
        drawRoundedRect(ctx, x, y, w, h, Math.min(w, h) * 0.18);
      }

      function quantizeMedianCut(rgba, maxColors, allowTransparent) {
        const pixelCount = rgba.length >> 2;
        const samples = [];
        const step = Math.max(1, Math.floor(pixelCount / 26000));
        let hasAlphaPixels = false;

        for (let i = 0; i < pixelCount; i++) {
          if (rgba[(i << 2) + 3] < 24) {
            hasAlphaPixels = true;
            break;
          }
        }

        for (let i = 0; i < pixelCount; i += step) {
          const idx = i << 2;
          if (allowTransparent && hasAlphaPixels && rgba[idx + 3] < 24) continue;
          samples.push([rgba[idx], rgba[idx + 1], rgba[idx + 2]]);
        }

        const palette = [];
        const useTransparent = Boolean(allowTransparent && hasAlphaPixels);
        const transparentIndex = 0;
        if (useTransparent) palette.push([0, 0, 0]);

        const targetColors = useTransparent
          ? Math.max(2, Math.min(255, (maxColors || 256) - 1))
          : Math.max(2, Math.min(256, maxColors || 256));

        if (samples.length === 0) {
          while (palette.length < 256) palette.push([18, 22, 38]);
          return { palette, hasTransparent: useTransparent, transparentIndex };
        }

        function buildBox(colors) {
          let rMin = 255, rMax = 0, gMin = 255, gMax = 0, bMin = 255, bMax = 0;
          for (let i = 0; i < colors.length; i++) {
            const [r, g, b] = colors[i];
            if (r < rMin) rMin = r;
            if (r > rMax) rMax = r;
            if (g < gMin) gMin = g;
            if (g > gMax) gMax = g;
            if (b < bMin) bMin = b;
            if (b > bMax) bMax = b;
          }
          const rSpan = rMax - rMin;
          const gSpan = gMax - gMin;
          const bSpan = bMax - bMin;
          let channel = 0;
          let maxSpan = rSpan;
          if (gSpan >= maxSpan) {
            maxSpan = gSpan;
            channel = 1;
          }
          if (bSpan >= maxSpan) {
            maxSpan = bSpan;
            channel = 2;
          }
          return { colors, channel, maxSpan };
        }

        const boxes = [buildBox(samples)];
        while (boxes.length < targetColors) {
          let bestIdx = -1;
          let bestSpan = -1;
          for (let i = 0; i < boxes.length; i++) {
            if (boxes[i].colors.length > 1 && boxes[i].maxSpan > bestSpan) {
              bestSpan = boxes[i].maxSpan;
              bestIdx = i;
            }
          }
          if (bestIdx === -1) break;
          const box = boxes[bestIdx];
          const ch = box.channel;
          box.colors.sort((a, b) => a[ch] - b[ch]);
          const mid = Math.floor(box.colors.length / 2);
          const left = box.colors.slice(0, mid);
          const right = box.colors.slice(mid);
          if (left.length === 0 || right.length === 0) break;
          boxes.splice(bestIdx, 1, buildBox(left), buildBox(right));
        }

        for (let i = 0; i < boxes.length; i++) {
          const cols = boxes[i].colors;
          let rSum = 0, gSum = 0, bSum = 0;
          for (let j = 0; j < cols.length; j++) {
            rSum += cols[j][0];
            gSum += cols[j][1];
            bSum += cols[j][2];
          }
          const len = Math.max(1, cols.length);
          palette.push([Math.round(rSum / len), Math.round(gSum / len), Math.round(bSum / len)]);
        }

        while (palette.length < 256) palette.push([15, 20, 38]);
        return { palette, hasTransparent: useTransparent, transparentIndex };
      }

      function mapRgbaToIndices(rgba, width, height, paletteInfo) {
        const { palette, hasTransparent, transparentIndex } = paletteInfo;
        const count = width * height;
        const indices = new Uint8Array(count);
        const cache = new Map();
        const startIdx = hasTransparent ? 1 : 0;

        for (let i = 0; i < count; i++) {
          const p = i << 2;
          if (hasTransparent && rgba[p + 3] < 24) {
            indices[i] = transparentIndex;
            continue;
          }
          const r = rgba[p];
          const g = rgba[p + 1];
          const b = rgba[p + 2];
          const key = ((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3);
          let bestIdx = cache.get(key);
          if (bestIdx === undefined) {
            let bestDist = Infinity;
            bestIdx = startIdx;
            for (let c = startIdx; c < palette.length; c++) {
              const pr = palette[c][0];
              const pg = palette[c][1];
              const pb = palette[c][2];
              const dr = r - pr;
              const dg = g - pg;
              const db = b - pb;
              const dist = dr * dr * 2 + dg * dg * 4 + db * db * 3;
              if (dist < bestDist) {
                bestDist = dist;
                bestIdx = c;
                if (dist === 0) break;
              }
            }
            cache.set(key, bestIdx);
          }
          indices[i] = bestIdx;
        }
        return indices;
      }

      function lzwEncode(minCodeSize, indexStream) {
        const clearCode = 1 << minCodeSize;
        const eoiCode = clearCode + 1;
        const maxCodeLimit = 4096;
        let codeSize = minCodeSize + 1;
        let nextCode = eoiCode + 1;
        let dict = new Map();

        function resetDict() {
          dict = new Map();
          codeSize = minCodeSize + 1;
          nextCode = eoiCode + 1;
        }

        resetDict();
        const out = [];
        let bitBuf = 0;
        let bitCount = 0;

        function writeBits(code, width) {
          bitBuf |= (code >>> 0) << bitCount;
          bitCount += width;
          while (bitCount >= 8) {
            out.push(bitBuf & 0xff);
            bitBuf >>>= 8;
            bitCount -= 8;
          }
        }

        function flushBits() {
          if (bitCount > 0) {
            out.push(bitBuf & 0xff);
            bitBuf = 0;
            bitCount = 0;
          }
        }

        writeBits(clearCode, codeSize);

        if (indexStream.length > 0) {
          let prefix = indexStream[0];
          for (let i = 1; i < indexStream.length; i++) {
            const k = indexStream[i];
            const key = (prefix << 8) | k;
            if (dict.has(key)) {
              prefix = dict.get(key);
            } else {
              writeBits(prefix, codeSize);
              if (nextCode < maxCodeLimit) {
                dict.set(key, nextCode);
                nextCode++;
                if (nextCode > (1 << codeSize) && codeSize < 12) codeSize++;
              } else {
                writeBits(clearCode, codeSize);
                resetDict();
              }
              prefix = k;
            }
          }
          writeBits(prefix, codeSize);
        }

        writeBits(eoiCode, codeSize);
        flushBits();

        const subBlocks = [];
        for (let i = 0; i < out.length; i += 255) {
          const slice = out.slice(i, i + 255);
          subBlocks.push(slice.length, ...slice);
        }
        subBlocks.push(0x00);
        return subBlocks;
      }

      function encodeAnimatedGif(width, height, framesWithDelays) {
        const w = Math.max(1, Math.min(65535, Math.round(width)));
        const h = Math.max(1, Math.min(65535, Math.round(height)));
        const safeFrames = Array.isArray(framesWithDelays) && framesWithDelays.length > 0
          ? framesWithDelays
          : [{ rgba: new Uint8Array(w * h * 4), delayCs: 10 }];

        const bytes = [];
        function pushStr(str) {
          for (let i = 0; i < str.length; i++) bytes.push(str.charCodeAt(i));
        }
        function pushU16(v) {
          bytes.push(v & 0xff, (v >>> 8) & 0xff);
        }

        pushStr("GIF89a");
        pushU16(w);
        pushU16(h);
        bytes.push(0x00, 0x00, 0x00);

        bytes.push(0x21, 0xff, 0x0b);
        pushStr("NETSCAPE2.0");
        bytes.push(0x03, 0x01);
        pushU16(0);
        bytes.push(0x00);

        for (let f = 0; f < safeFrames.length; f++) {
          const frame = safeFrames[f];
          const paletteInfo = quantizeMedianCut(frame.rgba, 256, false);
          const indices = mapRgbaToIndices(frame.rgba, w, h, paletteInfo);

          bytes.push(0x21, 0xf9, 0x04, 0x08);
          const rawDelay = Number(frame.delayCs);
          const delayCs = Math.max(6, Math.min(60, Math.round(isNaN(rawDelay) || rawDelay <= 1 ? 8 : rawDelay)));
          pushU16(delayCs);
          bytes.push(0x00, 0x00);

          bytes.push(0x2c);
          pushU16(0);
          pushU16(0);
          pushU16(w);
          pushU16(h);
          bytes.push(0x87);

          for (let c = 0; c < 256; c++) {
            const col = paletteInfo.palette[c] || [0, 0, 0];
            bytes.push(col[0] & 0xff, col[1] & 0xff, col[2] & 0xff);
          }

          bytes.push(8);
          const lzwData = lzwEncode(8, indices);
          for (let b = 0; b < lzwData.length; b++) {
            bytes.push(lzwData[b]);
          }
        }

        bytes.push(0x3b);
        return new Blob([new Uint8Array(bytes)], { type: "image/gif" });
      }

      function parseGifSubBlocksToCanvasList(arrayBuffer, maxFrames) {
        const limit = maxFrames || 24;
        const bytes = new Uint8Array(arrayBuffer);
        if (bytes.length < 13) return null;

        const sig = String.fromCharCode(bytes[0], bytes[1], bytes[2], bytes[3], bytes[4], bytes[5]);
        if (sig !== "GIF87a" && sig !== "GIF89a") return null;

        const logicalW = Math.max(1, bytes[6] | (bytes[7] << 8));
        const logicalH = Math.max(1, bytes[8] | (bytes[9] << 8));
        const packedGct = bytes[10];
        const hasGct = Boolean(packedGct & 0x80);
        const gctSize = hasGct ? 2 << (packedGct & 0x07) : 0;

        let pos = 13;
        let globalColorTable = null;
        if (hasGct) {
          globalColorTable = [];
          for (let i = 0; i < gctSize; i++) {
            const base = pos + i * 3;
            globalColorTable.push(base + 2 < bytes.length ? [bytes[base], bytes[base + 1], bytes[base + 2]] : [0, 0, 0]);
          }
          pos += gctSize * 3;
        }

        function readSubBlocks() {
          const chunks = [];
          while (pos < bytes.length) {
            const blockSize = bytes[pos++];
            if (blockSize === 0) break;
            if (pos + blockSize > bytes.length) {
              chunks.push(bytes.subarray(pos));
              pos = bytes.length;
              break;
            }
            chunks.push(bytes.subarray(pos, pos + blockSize));
            pos += blockSize;
          }
          let totalLen = 0;
          for (let i = 0; i < chunks.length; i++) totalLen += chunks[i].length;
          const merged = new Uint8Array(totalLen);
          let offset = 0;
          for (let i = 0; i < chunks.length; i++) {
            merged.set(chunks[i], offset);
            offset += chunks[i].length;
          }
          return merged;
        }

        function lzwDecode(minCodeSize, compressed, pixelCount) {
          const safeMin = Math.max(2, Math.min(11, minCodeSize || 8));
          const clearCode = 1 << safeMin;
          const eoiCode = clearCode + 1;
          let codeSize = safeMin + 1;
          let nextCode = eoiCode + 1;
          let dict = [];

          function resetDict() {
            dict = [];
            for (let i = 0; i < clearCode; i++) dict[i] = [i];
            dict[clearCode] = [clearCode];
            dict[eoiCode] = [eoiCode];
            codeSize = safeMin + 1;
            nextCode = eoiCode + 1;
          }

          resetDict();
          const output = new Uint8Array(pixelCount);
          let outIdx = 0;
          let bitPos = 0;
          let prevEntry = null;
          const totalBits = compressed.length * 8;

          function readCode() {
            if (bitPos + codeSize > totalBits) return eoiCode;
            let code = 0;
            for (let b = 0; b < codeSize; b++) {
              const bitCursor = bitPos + b;
              if ((compressed[bitCursor >> 3] >> (bitCursor & 7)) & 1) {
                code |= 1 << b;
              }
            }
            bitPos += codeSize;
            return code;
          }

          while (outIdx < pixelCount) {
            const code = readCode();
            if (code === eoiCode) break;
            if (code === clearCode) {
              resetDict();
              prevEntry = null;
              continue;
            }
            let entry;
            if (dict[code]) {
              entry = dict[code];
            } else if (code === nextCode && prevEntry) {
              entry = prevEntry.concat(prevEntry[0]);
            } else {
              break;
            }
            for (let i = 0; i < entry.length && outIdx < pixelCount; i++) {
              output[outIdx++] = entry[i];
            }
            if (prevEntry && nextCode < 4096) {
              dict[nextCode++] = prevEntry.concat(entry[0]);
              if (nextCode >= (1 << codeSize) && codeSize < 12) codeSize++;
            }
            prevEntry = entry;
          }
          return output;
        }

        let pendingDisposal = 0;
        let pendingDelayCs = 8;
        let pendingTransIndex = -1;
        let pendingHasTrans = false;

        const compCanvas = document.createElement("canvas");
        compCanvas.width = logicalW;
        compCanvas.height = logicalH;
        const compCtx = compCanvas.getContext("2d", { willReadFrequently: true });
        let prevSnapshot = null;
        let prevRect = null;
        let prevDisposal = 0;
        const frames = [];

        while (pos < bytes.length && frames.length < limit) {
          const sentinel = bytes[pos++];
          if (sentinel === 0x3b) break;

          if (sentinel === 0x21) {
            if (pos >= bytes.length) break;
            const label = bytes[pos++];
            if (label === 0xf9) {
              if (pos < bytes.length) {
                const gceSize = bytes[pos++];
                const blockEnd = Math.min(bytes.length, pos + gceSize);
                if (pos < blockEnd) {
                  const packed = bytes[pos++];
                  pendingDisposal = (packed >> 2) & 0x07;
                  pendingHasTrans = Boolean(packed & 0x01);
                }
                if (pos + 1 < blockEnd) {
                  const delayRaw = bytes[pos] | (bytes[pos + 1] << 8);
                  pendingDelayCs = Math.max(6, Math.min(50, delayRaw > 1 ? delayRaw : 8));
                  pos += 2;
                }
                if (pos < blockEnd) {
                  const transIdx = bytes[pos++];
                  pendingTransIndex = pendingHasTrans ? transIdx : -1;
                }
                pos = blockEnd;
                if (pos < bytes.length && bytes[pos] === 0x00) pos++;
              } else {
                break;
              }
            } else {
              readSubBlocks();
            }
            continue;
          }

          if (sentinel === 0x2c) {
            if (pos + 9 > bytes.length) break;
            const left = bytes[pos] | (bytes[pos + 1] << 8);
            const top = bytes[pos + 2] | (bytes[pos + 3] << 8);
            const imgW = Math.max(1, bytes[pos + 4] | (bytes[pos + 5] << 8));
            const imgH = Math.max(1, bytes[pos + 6] | (bytes[pos + 7] << 8));
            const imgPacked = bytes[pos + 8];
            pos += 9;

            const hasLct = Boolean(imgPacked & 0x80);
            const interlaced = Boolean(imgPacked & 0x40);
            const lctSize = hasLct ? 2 << (imgPacked & 0x07) : 0;

            let activePalette = globalColorTable;
            if (hasLct) {
              const localPal = [];
              for (let i = 0; i < lctSize; i++) {
                localPal.push(pos + 2 < bytes.length ? [bytes[pos], bytes[pos + 1], bytes[pos + 2]] : [0, 0, 0]);
                if (pos + 2 < bytes.length) pos += 3;
              }
              activePalette = localPal;
            }

            if (pos >= bytes.length) break;
            const minCodeSize = bytes[pos++];
            const compressedData = readSubBlocks();

            if (prevDisposal === 2 && prevRect) {
              compCtx.clearRect(prevRect.left, prevRect.top, prevRect.imgW, prevRect.imgH);
            } else if (prevDisposal === 3 && prevSnapshot) {
              compCtx.putImageData(prevSnapshot, 0, 0);
            }

            prevSnapshot = pendingDisposal === 3 ? compCtx.getImageData(0, 0, logicalW, logicalH) : null;

            const pixelIndices = lzwDecode(minCodeSize, compressedData, imgW * imgH);
            const patchData = compCtx.createImageData(imgW, imgH);
            const dst = patchData.data;
            const passStarts = [0, 4, 2, 1];
            const passSteps = [8, 8, 4, 2];

            for (let row = 0; row < imgH; row++) {
              let targetRow = row;
              if (interlaced) {
                let acc = 0;
                for (let p = 0; p < 4; p++) {
                  const s = passStarts[p];
                  const st = passSteps[p];
                  const countInPass = s < imgH ? Math.floor((imgH - 1 - s) / st) + 1 : 0;
                  if (row < acc + countInPass) {
                    targetRow = s + (row - acc) * st;
                    break;
                  }
                  acc += countInPass;
                }
              }

              for (let col = 0; col < imgW; col++) {
                const srcIdx = pixelIndices[row * imgW + col];
                const outOffset = (targetRow * imgW + col) << 2;
                if (pendingHasTrans && srcIdx === pendingTransIndex) {
                  dst[outOffset] = 0;
                  dst[outOffset + 1] = 0;
                  dst[outOffset + 2] = 0;
                  dst[outOffset + 3] = 0;
                } else {
                  const rgb = (activePalette && activePalette[srcIdx]) || [0, 0, 0];
                  dst[outOffset] = rgb[0];
                  dst[outOffset + 1] = rgb[1];
                  dst[outOffset + 2] = rgb[2];
                  dst[outOffset + 3] = 255;
                }
              }
            }

            const patchCanvas = document.createElement("canvas");
            patchCanvas.width = imgW;
            patchCanvas.height = imgH;
            patchCanvas.getContext("2d").putImageData(patchData, 0, 0);
            compCtx.drawImage(patchCanvas, left, top);

            prevRect = { left, top, imgW, imgH };
            prevDisposal = pendingDisposal;

            const frameCanvas = document.createElement("canvas");
            frameCanvas.width = logicalW;
            frameCanvas.height = logicalH;
            frameCanvas.getContext("2d").drawImage(compCanvas, 0, 0);

            frames.push({ canvas: frameCanvas, delayCs: pendingDelayCs });
            pendingDisposal = 0;
            pendingDelayCs = 8;
            pendingTransIndex = -1;
            pendingHasTrans = false;
          } else {
            break;
          }
        }

        return frames.length > 0 ? frames : null;
      }

      async function fetchGifArrayBufferWithFallback(src) {
        if (!src) return null;
        if (src.startsWith("data:")) {
          try {
            const resp = await fetch(src);
            if (resp.ok) return await resp.arrayBuffer();
          } catch (_e) {
            return null;
          }
          return null;
        }
        try {
          const resp = await fetch(src, { mode: "cors", credentials: "omit" });
          if (resp && resp.ok) {
            const buf = await resp.arrayBuffer();
            if (buf && buf.byteLength >= 13) return buf;
          }
        } catch (_corsErr) {
          // Respaldo
        }
        try {
          const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(src)}`;
          const pResp = await fetch(proxyUrl, { mode: "cors" });
          if (pResp && pResp.ok) {
            const pBuf = await pResp.arrayBuffer();
            if (pBuf && pBuf.byteLength >= 13) return pBuf;
          }
        } catch (_pErr) {
          return null;
        }
        return null;
      }

      async function decodeAnimatedGifFrames(src, maxFrames) {
        const limit = maxFrames || 24;
        if (!src || !isGifMedia(src)) return null;
        const arrayBuf = await fetchGifArrayBufferWithFallback(src);
        if (arrayBuf) {
          const parsedFrames = parseGifSubBlocksToCanvasList(arrayBuf, limit);
          if (parsedFrames && parsedFrames.length > 0) {
            return { frames: parsedFrames, tainted: false };
          }
        }
        return new Promise((resolve) => {
          const img = new Image();
          if (!src.startsWith("data:")) img.crossOrigin = "anonymous";
          img.onload = () => {
            const c = document.createElement("canvas");
            c.width = img.naturalWidth || 200;
            c.height = img.naturalHeight || 200;
            try {
              c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
              c.getContext("2d").getImageData(0, 0, 1, 1);
              resolve({ frames: [{ canvas: c, delayCs: 8 }], tainted: false });
            } catch (_corsErr) {
              resolve({ frames: null, tainted: true });
            }
          };
          img.onerror = () => resolve({ frames: null, tainted: !src.startsWith("data:") });
          img.src = src;
        });
      }

      function wrapLinesCanvas(ctx, text, maxWidth) {
        const clean = String(text || "").replace(/\r\n/g, "\n").trim();
        if (!clean) return [];
        const paragraphs = clean.split("\n");
        const lines = [];
        for (let p = 0; p < paragraphs.length; p++) {
          const words = paragraphs[p].trim().split(/\s+/).filter(Boolean);
          if (words.length === 0) {
            if (p < paragraphs.length - 1) lines.push("");
            continue;
          }
          let current = words[0];
          for (let w = 1; w < words.length; w++) {
            const candidate = current + " " + words[w];
            if (ctx.measureText(candidate).width <= maxWidth) {
              current = candidate;
            } else {
              lines.push(current);
              current = words[w];
            }
          }
          lines.push(current);
        }
        return lines;
      }

      function drawMediaCoverSafe(ctx, mediaSource, dx, dy, dw, dh, alignPos) {
        if (!mediaSource) return false;
        const sw = mediaSource.naturalWidth || mediaSource.videoWidth || mediaSource.width || 0;
        const sh = mediaSource.naturalHeight || mediaSource.videoHeight || mediaSource.height || 0;
        if (!sw || !sh || !dw || !dh) return false;
        try {
          const scale = Math.max(dw / sw, dh / sh);
          const drawW = sw * scale;
          const drawH = sh * scale;
          const drawX = dx + (dw - drawW) * 0.5;
          let drawY = dy + (dh - drawH) * 0.5;
          if (alignPos === "top") drawY = dy;
          else if (alignPos === "bottom") drawY = dy + dh - drawH;
          ctx.save();
          drawRoundedRect(ctx, dx, dy, dw, dh, 0);
          ctx.clip();
          ctx.drawImage(mediaSource, drawX, drawY, drawW, drawH);
          ctx.restore();
          return true;
        } catch (_err) {
          return false;
        }
      }

      function getOverlayReferenceWidth() {
        return 520;
      }

      function renderCardToCanvas(canvas, char, mediaBundle, frameIdx) {
        const width = 920;
        const padX = 42;
        const innerW = width - padX * 2;
        const theme = buildThemeFromCharacter(char);
        const fontObj = getFontById(char.nameFontId);
        const dominant = getDominantEmotion(char.emotions);

        const measureCtx = canvas.getContext("2d");
        measureCtx.font = fontObj.canvas.replace("%s", "44");
        const nameLines = wrapLinesCanvas(measureCtx, char.name || "Personaje", innerW - 170);

        measureCtx.font = "600 20px 'Plus Jakarta Sans', sans-serif";
        const posLines = char.position ? wrapLinesCanvas(measureCtx, `Posición actual: ${char.position}`, innerW - 44) : [];

        measureCtx.font = "400 20px 'Plus Jakarta Sans', sans-serif";
        const descLines = char.description ? wrapLinesCanvas(measureCtx, char.description, innerW - 40) : [];

        const hasMusic = Boolean(char.spotifyUrl || char.spotifyTitle);
        const spParsed = parseSpotifyUrl(char.spotifyUrl);
        const hasSamplePreview = Boolean(spParsed && spParsed.embedUrl);
        const musicHeight = hasMusic ? (hasSamplePreview ? 256 : 156) : 0;

        const emotions = Array.isArray(char.emotions) ? char.emotions : [];
        const colGap = 20;
        const cardW = (innerW - colGap) / 2;
        const rows = [];
        for (let i = 0; i < emotions.length; i += 2) {
          const leftEmo = emotions[i];
          const rightEmo = emotions[i + 1] || null;
          measureCtx.font = "400 16px 'Plus Jakarta Sans', sans-serif";
          const leftNoteLines = leftEmo && leftEmo.note ? wrapLinesCanvas(measureCtx, leftEmo.note, cardW - 36) : [];
          const rightNoteLines = rightEmo && rightEmo.note ? wrapLinesCanvas(measureCtx, rightEmo.note, cardW - 36) : [];
          const maxNoteLines = Math.max(leftNoteLines.length, rightNoteLines.length);
          const rowH = 88 + maxNoteLines * 24 + (maxNoteLines > 0 ? 10 : 0);
          rows.push({ leftEmo, rightEmo, leftNoteLines, rightNoteLines, rowH });
        }

        const emotionsBlockHeight = rows.length > 0 ? 44 + rows.reduce((acc, r) => acc + r.rowH + 16, 0) + 8 : 0;

        measureCtx.font = "400 18px 'Plus Jakarta Sans', sans-serif";
        const tipLines = char.tipsWarnings ? wrapLinesCanvas(measureCtx, char.tipsWarnings, innerW - 40) : [];
        const tipsHeight = tipLines.length > 0 ? 56 + tipLines.length * 27 + 22 : 0;

        const bannerH = 220;
        const headerBottomY = bannerH + 92 + Math.max(0, (nameLines.length - 1) * 48);

        let cursorY = headerBottomY + 24;
        if (posLines.length > 0) cursorY += posLines.length * 29 + 24 + 20;
        if (descLines.length > 0) cursorY += descLines.length * 30 + 30 + 22;
        if (hasMusic) cursorY += musicHeight + 24;
        if (emotionsBlockHeight > 0) cursorY += emotionsBlockHeight + 18;
        if (tipsHeight > 0) cursorY += tipsHeight + 18;
        const totalHeight = Math.max(680, cursorY + 64);

        canvas.width = width;
        canvas.height = totalHeight;
        const ctx = canvas.getContext("2d");

        const bgGrad = ctx.createLinearGradient(0, 0, width, totalHeight);
        bgGrad.addColorStop(0, theme.bgStart);
        bgGrad.addColorStop(1, theme.bgEnd);
        ctx.fillStyle = theme.isSolid ? theme.bgStart : bgGrad;
        ctx.fillRect(0, 0, width, totalHeight);

        const bodyMedia = mediaBundle.bodyFrames && mediaBundle.bodyFrames.length > 0
          ? mediaBundle.bodyFrames[frameIdx % mediaBundle.bodyFrames.length].canvas
          : mediaBundle.bodyImg;
        if (bodyMedia) {
          drawMediaCoverSafe(ctx, bodyMedia, 0, bannerH, width, totalHeight - bannerH, char.bodyBgPosition);
          ctx.fillStyle = `rgba(9, 13, 26, ${char.bodyBgOverlay ?? 0.68})`;
          ctx.fillRect(0, bannerH, width, totalHeight - bannerH);
        }

        const bannerMedia = mediaBundle.bannerFrames && mediaBundle.bannerFrames.length > 0
          ? mediaBundle.bannerFrames[frameIdx % mediaBundle.bannerFrames.length].canvas
          : mediaBundle.bannerImg;

        const bannerGrad = ctx.createLinearGradient(0, 0, width, bannerH);
        bannerGrad.addColorStop(0, theme.accent);
        bannerGrad.addColorStop(1, theme.bgEnd);
        ctx.fillStyle = theme.isSolid ? theme.bgStart : bannerGrad;
        ctx.fillRect(0, 0, width, bannerH);

        if (bannerMedia) {
          drawMediaCoverSafe(ctx, bannerMedia, 0, 0, width, bannerH, char.bannerPosition);
          const scrim = ctx.createLinearGradient(0, 0, 0, bannerH);
          scrim.addColorStop(0, "rgba(0,0,0,0.18)");
          scrim.addColorStop(1, "rgba(9,13,26,0.52)");
          ctx.fillStyle = scrim;
          ctx.fillRect(0, 0, width, bannerH);
        }

        const domLabel = `Dominante: ${dominant.label} (${dominant.value}%)`;
        ctx.font = "700 16px 'Plus Jakarta Sans', sans-serif";
        const pillW = ctx.measureText(domLabel).width + 44;
        const pillX = width - padX - pillW;
        const pillY = 22;
        ctx.fillStyle = "rgba(10, 14, 28, 0.78)";
        drawRoundedRect(ctx, pillX, pillY, pillW, 38, 19);
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,0.16)";
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = dominant.color || theme.accent;
        ctx.beginPath();
        ctx.arc(pillX + 18, pillY + 19, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#f8fafc";
        ctx.fillText(domLabel, pillX + 32, pillY + 25);

        const avatarShape = char.avatarShape || "rounded-square";
        const baseAvatarSize = 136;
        const scaleFactor = Math.max(0.7, Math.min(1.45, (Number(char.avatarScale) || 100) / 100)) * (avatarShape === "heart" ? 1.28 : 1);
        const avatarSize = Math.round(baseAvatarSize * scaleFactor);
        const avatarX = padX;
        const avatarY = bannerH - avatarSize / 2;

        ctx.save();
        ctx.fillStyle = theme.surface;
        applyAvatarShapeClip(ctx, avatarShape, avatarX, avatarY, avatarSize, avatarSize);
        ctx.fill();

        const avatarMedia = mediaBundle.avatarFrames && mediaBundle.avatarFrames.length > 0
          ? mediaBundle.avatarFrames[frameIdx % mediaBundle.avatarFrames.length].canvas
          : mediaBundle.avatarImg;

        if (avatarMedia) {
          ctx.save();
          applyAvatarShapeClip(ctx, avatarShape, avatarX, avatarY, avatarSize, avatarSize);
          ctx.clip();
          const sw = avatarMedia.naturalWidth || avatarMedia.width || avatarSize;
          const sh = avatarMedia.naturalHeight || avatarMedia.height || avatarSize;
          const zoom = avatarShape === "heart" ? 1.06 : 1;
          const scale = Math.max(avatarSize / sw, avatarSize / sh) * zoom;
          const dw = sw * scale;
          const dh = sh * scale;
          const dx = avatarX + (avatarSize - dw) * 0.5;
          let dy = avatarY + (avatarSize - dh) * 0.5;
          if (char.avatarPosition === "top") dy = avatarY;
          else if (char.avatarPosition === "bottom") dy = avatarY + (avatarSize - dh);
          ctx.drawImage(avatarMedia, dx, dy, dw, dh);
          ctx.restore();
        } else {
          ctx.save();
          applyAvatarShapeClip(ctx, avatarShape, avatarX, avatarY, avatarSize, avatarSize);
          ctx.clip();
          ctx.fillStyle = theme.accent;
          ctx.font = `800 ${Math.round(44 * scaleFactor)}px 'Plus Jakarta Sans', sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(getInitials(char.name), avatarX + avatarSize / 2, avatarY + avatarSize / 2 + 2);
          ctx.textAlign = "left";
          ctx.textBaseline = "alphabetic";
          ctx.restore();
        }

        ctx.strokeStyle = theme.accent;
        ctx.lineWidth = 3;
        applyAvatarShapeClip(ctx, avatarShape, avatarX, avatarY, avatarSize, avatarSize);
        ctx.stroke();
        ctx.restore();

        const textLeftX = avatarX + avatarSize + 24;
        let infoY = bannerH + 34;

        if (char.title) {
          ctx.font = "700 15px 'Plus Jakarta Sans', sans-serif";
          const titleW = Math.min(innerW - (textLeftX - padX), ctx.measureText(char.title.toUpperCase()).width + 24);
          ctx.fillStyle = theme.badgeBg;
          drawRoundedRect(ctx, textLeftX, infoY - 18, titleW, 26, 8);
          ctx.fill();
          ctx.fillStyle = theme.badgeText;
          ctx.fillText(char.title.toUpperCase(), textLeftX + 12, infoY);
          infoY += 34;
        }

        ctx.font = fontObj.canvas.replace("%s", "44");
        ctx.fillStyle = theme.text;
        for (let i = 0; i < nameLines.length; i++) {
          ctx.fillText(nameLines[i], textLeftX, infoY + i * 48);
        }

        let y = Math.max(avatarY + avatarSize + 24, infoY + nameLines.length * 48 + 16);

        if (posLines.length > 0) {
          const boxH = posLines.length * 29 + 22;
          ctx.fillStyle = theme.surface;
          drawRoundedRect(ctx, padX, y, innerW, boxH, 14);
          ctx.fill();
          ctx.strokeStyle = theme.border;
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.fillStyle = theme.accent;
          drawRoundedRect(ctx, padX, y + 10, 5, boxH - 20, 3);
          ctx.fill();

          ctx.font = "600 20px 'Plus Jakarta Sans', sans-serif";
          ctx.fillStyle = theme.text;
          for (let i = 0; i < posLines.length; i++) {
            ctx.fillText(posLines[i], padX + 20, y + 31 + i * 29);
          }
          y += boxH + 18;
        }

        if (descLines.length > 0) {
          const descH = descLines.length * 30 + 28;
          ctx.fillStyle = theme.surface;
          drawRoundedRect(ctx, padX, y, innerW, descH, 16);
          ctx.fill();
          ctx.strokeStyle = theme.border;
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.font = "400 20px 'Plus Jakarta Sans', sans-serif";
          ctx.fillStyle = theme.text;
          for (let i = 0; i < descLines.length; i++) {
            ctx.fillText(descLines[i], padX + 20, y + 32 + i * 30);
          }
          y += descH + 18;
        }

        if (hasMusic) {
          ctx.fillStyle = theme.surface;
          drawRoundedRect(ctx, padX, y, innerW, musicHeight, 18);
          ctx.fill();
          ctx.strokeStyle = theme.border;
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.font = "700 14px 'Plus Jakarta Sans', sans-serif";
          ctx.fillStyle = theme.muted;
          ctx.fillText("MÚSICA", padX + 20, y + 26);

          const widgetX = padX + 20;
          const widgetY = y + 38;
          const widgetW = innerW - 40;
          const widgetH = 98;

          const spGrad = ctx.createLinearGradient(widgetX, widgetY, widgetX + widgetW, widgetY + widgetH);
          spGrad.addColorStop(0, theme.accent);
          spGrad.addColorStop(0.55, theme.bgEnd);
          spGrad.addColorStop(1, theme.bgStart);
          ctx.fillStyle = theme.isSolid ? theme.surface : spGrad;
          drawRoundedRect(ctx, widgetX, widgetY, widgetW, widgetH, 16);
          ctx.fill();
          ctx.strokeStyle = theme.border;
          ctx.lineWidth = 1.5;
          ctx.stroke();

          const thumbSize = 70;
          const thumbX = widgetX + 14;
          const thumbY = widgetY + 14;
          ctx.fillStyle = "rgba(10, 14, 28, 0.55)";
          drawRoundedRect(ctx, thumbX, thumbY, thumbSize, thumbSize, 10);
          ctx.fill();

          if (!mediaBundle.spotifyCoverImg || !drawMediaCoverSafe(ctx, mediaBundle.spotifyCoverImg, thumbX, thumbY, thumbSize, thumbSize, "center")) {
            ctx.fillStyle = "#ffffff";
            ctx.font = "800 24px 'Plus Jakarta Sans', sans-serif";
            ctx.fillText("♪", thumbX + 24, thumbY + 44);
          }

          const trackTitle = char.spotifyTitle || (spParsed && spParsed.id ? `Canción en Spotify (${spParsed.kind})` : "Canción de Spotify");
          const trackSub = char.spotifyArtist || "Spotify";
          const musicTextColor = theme.isSolid ? theme.text : "#ffffff";

          ctx.fillStyle = musicTextColor;
          ctx.font = "700 21px 'Plus Jakarta Sans', sans-serif";
          ctx.fillText(trackTitle.slice(0, 44), thumbX + thumbSize + 18, widgetY + 38);

          ctx.fillStyle = musicTextColor;
          ctx.font = "500 16px 'Plus Jakarta Sans', sans-serif";
          ctx.fillText(trackSub.slice(0, 48), thumbX + thumbSize + 18, widgetY + 64);

          ctx.fillStyle = "rgba(10, 14, 28, 0.72)";
          drawRoundedRect(ctx, thumbX + thumbSize + 18, widgetY + 72, 132, 20, 6);
          ctx.fill();
          ctx.fillStyle = "#ffffff";
          ctx.font = "700 11px 'Plus Jakarta Sans', sans-serif";
          ctx.fillText(hasSamplePreview ? "SPOTIFY • MUESTRA" : "SPOTIFY", thumbX + thumbSize + 28, widgetY + 86);

          const playCx = widgetX + widgetW - 38;
          const playCy = widgetY + widgetH / 2;
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(playCx, playCy, 20, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#0f172a";
          ctx.beginPath();
          ctx.moveTo(playCx - 5, playCy - 8);
          ctx.lineTo(playCx - 5, playCy + 8);
          ctx.lineTo(playCx + 8, playCy);
          ctx.closePath();
          ctx.fill();

          if (hasSamplePreview) {
            const sampleY = widgetY + widgetH + 12;
            const sampleH = 82;
            ctx.fillStyle = "rgba(10, 14, 28, 0.72)";
            drawRoundedRect(ctx, widgetX, sampleY, widgetW, sampleH, 14);
            ctx.fill();
            ctx.strokeStyle = "rgba(255,255,255,0.14)";
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.fillStyle = "#22c55e";
            ctx.beginPath();
            ctx.arc(widgetX + 24, sampleY + 26, 7, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#f8fafc";
            ctx.font = "700 15px 'Plus Jakarta Sans', sans-serif";
            ctx.fillText("Muestra interactiva de Spotify disponible en la tarjeta", widgetX + 40, sampleY + 31);

            const barX = widgetX + 40;
            const barY = sampleY + 50;
            const barW = widgetW - 64;
            ctx.fillStyle = "rgba(255,255,255,0.14)";
            drawRoundedRect(ctx, barX, barY, barW, 8, 4);
            ctx.fill();

            const animProgress = 0.28 + ((frameIdx % 12) / 12) * 0.44;
            ctx.fillStyle = "#22c55e";
            drawRoundedRect(ctx, barX, barY, barW * animProgress, 8, 4);
            ctx.fill();
          }

          y += musicHeight + 18;
        }

        if (rows.length > 0) {
          ctx.font = "800 15px 'Plus Jakarta Sans', sans-serif";
          ctx.fillStyle = theme.muted;
          ctx.fillText("ESTADÍSTICAS Y EMOCIONES", padX, y + 18);
          y += 32;

          for (let r = 0; r < rows.length; r++) {
            const row = rows[r];
            const items = [
              { emo: row.leftEmo, noteLines: row.leftNoteLines, x: padX },
              { emo: row.rightEmo, noteLines: row.rightNoteLines, x: padX + cardW + colGap }
            ];

            for (let c = 0; c < items.length; c++) {
              const item = items[c];
              if (!item.emo) continue;
              const pct = Math.max(0, Math.min(100, Number(item.emo.value) || 0));
              const col = item.emo.color || theme.accent;

              ctx.fillStyle = theme.surface;
              drawRoundedRect(ctx, item.x, y, cardW, row.rowH, 16);
              ctx.fill();
              ctx.strokeStyle = theme.border;
              ctx.lineWidth = 1;
              ctx.stroke();

              ctx.fillStyle = col;
              ctx.beginPath();
              ctx.arc(item.x + 22, y + 26, 6, 0, Math.PI * 2);
              ctx.fill();

              ctx.font = "700 18px 'Plus Jakarta Sans', sans-serif";
              ctx.fillStyle = theme.text;
              ctx.fillText(item.emo.label || "Emoción", item.x + 36, y + 32);

              ctx.textAlign = "right";
              ctx.fillStyle = col;
              ctx.fillText(`${pct}%`, item.x + cardW - 18, y + 32);
              ctx.textAlign = "left";

              const barX = item.x + 18;
              const barY = y + 48;
              const barW = cardW - 36;
              const barH = 10;
              ctx.fillStyle = "rgba(148, 163, 184, 0.22)";
              drawRoundedRect(ctx, barX, barY, barW, barH, 5);
              ctx.fill();

              const fillW = Math.max(0, (barW * pct) / 100);
              if (fillW > 0) {
                ctx.fillStyle = col;
                drawRoundedRect(ctx, barX, barY, fillW, barH, 5);
                ctx.fill();
              }

              if (item.noteLines.length > 0) {
                ctx.font = "400 16px 'Plus Jakarta Sans', sans-serif";
                ctx.fillStyle = theme.muted;
                for (let n = 0; n < item.noteLines.length; n++) {
                  ctx.fillText(item.noteLines[n], item.x + 18, y + 82 + n * 24);
                }
              }
            }
            y += row.rowH + 16;
          }
        }

        if (tipLines.length > 0) {
          ctx.fillStyle = theme.surface;
          drawRoundedRect(ctx, padX, y, innerW, tipsHeight, 16);
          ctx.fill();
          ctx.strokeStyle = theme.border;
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.font = "800 14px 'Plus Jakarta Sans', sans-serif";
          ctx.fillStyle = theme.muted;
          ctx.fillText("ADVERTENCIAS Y CONSEJOS", padX + 20, y + 28);

          ctx.font = "400 18px 'Plus Jakarta Sans', sans-serif";
          ctx.fillStyle = theme.text;
          for (let i = 0; i < tipLines.length; i++) {
            ctx.fillText(tipLines[i], padX + 20, y + 56 + i * 27);
          }
        }

        const overlays = Array.isArray(char.overlays) ? char.overlays : [];
        const overlayAssets = mediaBundle.overlayAssets || [];
        for (let i = 0; i < overlays.length; i++) {
          const ov = overlays[i];
          const asset = overlayAssets[i];
          if (!asset) continue;
          const mediaSource = asset.frames && asset.frames.length > 0
            ? asset.frames[frameIdx % asset.frames.length].canvas
            : asset.img;
          if (!mediaSource) continue;

          const sw = mediaSource.naturalWidth || mediaSource.videoWidth || mediaSource.width || 120;
          const sh = mediaSource.naturalHeight || mediaSource.videoHeight || mediaSource.height || 120;
          const aspect = sw > 0 && sh > 0 ? sh / sw : 1;
          const refWidth = getOverlayReferenceWidth();
          const scaledSize = ((Number(ov.size) || 88) / refWidth) * width;
          const drawW = Math.max(20, Math.min(width * 0.72, scaledSize));
          const drawH = drawW * aspect;
          const centerX = ((Number(ov.x) || 50) / 100) * width;
          const centerY = ((Number(ov.y) || 50) / 100) * totalHeight;
          try {
            ctx.save();
            ctx.drawImage(mediaSource, centerX - drawW * 0.5, centerY - drawH * 0.5, drawW, drawH);
            ctx.restore();
          } catch (_err) {
            // Omitir si está bloqueado
          }
        }
      }

      async function loadImageSafe(src) {
        if (!src) return { img: null, tainted: false };
        return new Promise((resolve) => {
          const img = new Image();
          if (!src.startsWith("data:")) img.crossOrigin = "anonymous";
          img.onload = () => {
            try {
              const testCanvas = document.createElement("canvas");
              testCanvas.width = 4;
              testCanvas.height = 4;
              const tctx = testCanvas.getContext("2d");
              tctx.drawImage(img, 0, 0, 4, 4);
              tctx.getImageData(0, 0, 1, 1);
              resolve({ img, tainted: false });
            } catch (_corsErr) {
              resolve({ img: null, tainted: true });
            }
          };
          img.onerror = () => resolve({ img: null, tainted: !src.startsWith("data:") });
          img.src = src;
        });
      }

      async function buildMediaBundleForExport(char) {
        const overlays = Array.isArray(char.overlays) ? char.overlays : [];
        let taintedCount = 0;
        let decodedGifCount = 0;

        const [avatarGifRes, bannerGifRes, bodyGifRes, avatarImgRes, bannerImgRes, bodyImgRes, spotifyCoverRes, overlayAssets] = await Promise.all([
          isGifMedia(char.avatarUrl) ? decodeAnimatedGifFrames(char.avatarUrl, 24) : Promise.resolve(null),
          isGifMedia(char.bannerUrl) ? decodeAnimatedGifFrames(char.bannerUrl, 24) : Promise.resolve(null),
          isGifMedia(char.bodyBgUrl) ? decodeAnimatedGifFrames(char.bodyBgUrl, 24) : Promise.resolve(null),
          !isGifMedia(char.avatarUrl) ? loadImageSafe(char.avatarUrl) : Promise.resolve({ img: null, tainted: false }),
          !isGifMedia(char.bannerUrl) ? loadImageSafe(char.bannerUrl) : Promise.resolve({ img: null, tainted: false }),
          !isGifMedia(char.bodyBgUrl) ? loadImageSafe(char.bodyBgUrl) : Promise.resolve({ img: null, tainted: false }),
          loadImageSafe(char.spotifyCover),
          Promise.all(
            overlays.map(async (ov) => {
              if (!ov || !ov.url) return { frames: null, img: null, tainted: false };
              if (isGifMedia(ov.url)) {
                const dec = await decodeAnimatedGifFrames(ov.url, 24);
                return { frames: dec && dec.frames ? dec.frames : null, img: null, tainted: Boolean(dec && dec.tainted) };
              }
              const loaded = await loadImageSafe(ov.url);
              return { frames: null, img: loaded.img, tainted: loaded.tainted };
            })
          )
        ]);

        [avatarGifRes, bannerGifRes, bodyGifRes].forEach((res) => {
          if (res && Array.isArray(res.frames) && res.frames.length > 0) decodedGifCount++;
          if (res && res.tainted) taintedCount++;
        });
        [avatarImgRes, bannerImgRes, bodyImgRes, spotifyCoverRes].forEach((res) => {
          if (res && res.tainted) taintedCount++;
        });
        overlayAssets.forEach((asset) => {
          if (asset && Array.isArray(asset.frames) && asset.frames.length > 0) decodedGifCount++;
          if (asset && asset.tainted) taintedCount++;
        });

        return {
          avatarFrames: avatarGifRes && avatarGifRes.frames ? avatarGifRes.frames : null,
          bannerFrames: bannerGifRes && bannerGifRes.frames ? bannerGifRes.frames : null,
          bodyFrames: bodyGifRes && bodyGifRes.frames ? bodyGifRes.frames : null,
          avatarImg: avatarImgRes ? avatarImgRes.img : null,
          bannerImg: bannerImgRes ? bannerImgRes.img : null,
          bodyImg: bodyImgRes ? bodyImgRes.img : null,
          spotifyCoverImg: spotifyCoverRes ? spotifyCoverRes.img : null,
          overlayAssets,
          taintedCount,
          decodedGifCount
        };
      }

        return appState.characters.find((c) => c.id === appState.selectedId) || appState.characters[0];

      function updateActiveCharacter(mutator, shouldRender) {

      function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ""));
          reader.onerror = () => reject(new Error("No se pudo leer el archivo"));
          reader.readAsDataURL(file);
        });

      async function handleExportCard(char) {
        if (uiState.isExporting) return;
        uiState.isExporting = true;
        uiState.exportProgressText = "Preparando medios y lienzo...";
        renderApp();

        try {
          const bundle = await buildMediaBundleForExport(char);
          const canvas = document.createElement("canvas");
          const animated = hasAnyGif(char);
          const corsNote = bundle.taintedCount > 0
            ? " Aviso: uno o más medios externos bloquearon la lectura de píxeles; si subes el GIF desde tu dispositivo se exportará con todos sus cuadros."
            : "";

          if (animated) {
            const overlayFrameLists = (bundle.overlayAssets || [])
              .map((a) => a && a.frames)
              .filter((arr) => Array.isArray(arr) && arr.length > 0);
            const frameLists = [bundle.avatarFrames, bundle.bannerFrames, bundle.bodyFrames, ...overlayFrameLists].filter(
              (arr) => Array.isArray(arr) && arr.length > 0
            );
            const maxLen = frameLists.reduce((m, arr) => Math.max(m, arr.length), 1);
            const totalFrames = Math.max(8, Math.min(24, maxLen));
            const framesWithDelays = [];

            for (let f = 0; f < totalFrames; f++) {
              uiState.exportProgressText = `Renderizando cuadro GIF ${f + 1} de ${totalFrames}...`;
              renderCardToCanvas(canvas, char, bundle, f);
              const imgData = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height);

              let delayCs = 8;
              for (let k = 0; k < frameLists.length; k++) {
                const fr = frameLists[k][f % frameLists[k].length];
                if (fr && fr.delayCs) {
                  delayCs = fr.delayCs;
                  break;
                }
              }
              framesWithDelays.push({ rgba: imgData.data, delayCs });
            }

            uiState.exportProgressText = "Codificando archivo GIF animado...";
            renderApp();
            const gifBlob = encodeAnimatedGif(canvas.width, canvas.height, framesWithDelays);
            const url = URL.createObjectURL(gifBlob);
            const a = document.createElement("a");
            const safeName = (char.name || "personaje").toLowerCase().replace(/[^a-z0-9]+/g, "-");
            a.href = url;
            a.download = `${safeName}-tarjeta.gif`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.setTimeout(() => URL.revokeObjectURL(url), 4000);
            setNotice(`GIF animado exportado (${totalFrames} cuadros, ${bundle.decodedGifCount} GIF(s) decodificados) para ${char.name}.${corsNote}`);
          } else {
            renderCardToCanvas(canvas, char, bundle, 0);
            canvas.toBlob((blob) => {
              if (!blob) {
                setNotice("No se pudo generar la imagen PNG.");
                return;
              }
              const url = URL.createObjectURL(blob);
              const a = document.createElement("a");
              const safeName = (char.name || "personaje").toLowerCase().replace(/[^a-z0-9]+/g, "-");
              a.href = url;
              a.download = `${safeName}-tarjeta.png`;
              document.body.appendChild(a);
              a.click();
              a.remove();
              window.setTimeout(() => URL.revokeObjectURL(url), 4000);
              setNotice(`Tarjeta PNG exportada para ${char.name}.${corsNote}`);
            }, "image/png");
          }
        } catch (_err) {
          setNotice("Ocurrió un error al exportar la tarjeta.");
        } finally {
          uiState.isExporting = false;
          uiState.exportProgressText = "";
          renderApp();
        }
      }

      async function copyShareLink(char, inputEl) {
        const shareData = encodeSharePayload(char);
        syncShareHashInAddressBar(char);
        const copied = await copyTextReliable(shareData.url, inputEl);
        if (copied) {
          const extra = shareData.notice ? ` (${shareData.notice})` : "";
          setNotice(`Enlace de tarjeta final (#share=) copiado al portapapeles.${extra}`);
          return true;
        }
        if (inputEl && typeof inputEl.focus === "function" && typeof inputEl.select === "function") {
          inputEl.focus();
          inputEl.select();
        }
        setNotice("El enlace #share= quedó seleccionado para copiar con Ctrl/Cmd + C.");
        return false;
      }

      function escapeHtml(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function renderMediaThumb(src, pos, fallbackInitials, isRoundedFull) {
        const alignCss = getObjectPositionCss(pos);
        const shapeCls = isRoundedFull ? "rounded-2xl" : "rounded-xl";
        if (src) {
          return `<img src="${escapeHtml(src)}" alt="Vista previa" style="object-position:${alignCss}" class="w-full h-full object-cover ${shapeCls}" />`;
        }
        return `<div class="w-full h-full flex items-center justify-center bg-slate-800/80 text-slate-300 font-bold text-sm ${shapeCls}">${escapeHtml(fallbackInitials || "IMG")}</div>`;
      }

      function renderMusicWidgetHtml(char, theme) {
        const hasMusic = Boolean(char.spotifyUrl || char.spotifyTitle);
        if (!hasMusic) return "";
        const parsed = parseSpotifyUrl(char.spotifyUrl);
        const title = char.spotifyTitle || (parsed && parsed.id ? `Canción de Spotify (${parsed.kind})` : "Canción en Spotify");
        const subtitle = char.spotifyArtist || "Spotify";
        const href = (parsed && parsed.url) || "#";
        const embedUrl = parsed && parsed.embedUrl ? parsed.embedUrl : "";
        const showSample = Boolean(embedUrl && uiState.spotifySampleOpen);
        const bgStyle = theme.isSolid
          ? theme.surface
          : `linear-gradient(115deg, ${theme.accent} 0%, ${theme.bgEnd} 58%, ${theme.bgStart} 100%)`;
        const fgColor = theme.isSolid ? theme.text : "#ffffff";

        return `
          <div class="mt-4">
            <div class="flex items-center justify-between gap-2 mb-2">
              <div class="text-xs font-extrabold uppercase tracking-wider" style="color:${theme.muted}">Música</div>
              ${
                embedUrl
                  ? `<button type="button" data-action="toggle-spotify-sample"
                             class="px-2.5 py-1 rounded-lg text-[11px] font-bold border transition cursor-pointer"
                             style="background:${showSample ? theme.accent : "rgba(255,255,255,0.08)"}; color:${showSample ? "#090d1a" : theme.text}; border-color:${theme.border};">
                       ${showSample ? "Ocultar muestra" : "Escuchar muestra"}
                     </button>`
                  : ""
              }
            </div>
            <div class="p-3 rounded-2xl border transition"
                 style="background:${bgStyle}; border-color:${theme.border}; color:${fgColor};">
              <div class="flex items-center justify-between gap-3">
                <a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer"
                   class="flex items-center gap-3 min-w-0 group flex-1">
                  <div class="w-12 h-12 rounded-xl overflow-hidden bg-slate-950/60 flex items-center justify-center shrink-0 border border-white/15">
                    ${
                      char.spotifyCover
                        ? `<img src="${escapeHtml(char.spotifyCover)}" alt="${escapeHtml(title)}" class="w-full h-full object-cover" />`
                        : `<span class="text-xl font-black text-white">♪</span>`
                    }
                  </div>
                  <div class="min-w-0">
                    <div class="font-bold text-base truncate group-hover:underline" style="color:${fgColor}">${escapeHtml(title)}</div>
                    <div class="text-xs sm:text-sm truncate opacity-85" style="color:${fgColor}">${escapeHtml(subtitle)}</div>
                    <div class="inline-block mt-1 px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-slate-950/65 text-white">
                      ${embedUrl ? "SPOTIFY • MUESTRA" : "SPOTIFY"}
                    </div>
                  </div>
                </a>

                <div class="flex items-center gap-2 shrink-0">
                  ${
                    embedUrl
                      ? `<button type="button" data-action="toggle-spotify-sample"
                                 class="px-3 py-1.5 rounded-full bg-emerald-400 hover:bg-emerald-300 text-slate-950 text-xs font-extrabold shadow transition cursor-pointer">
                           ${showSample ? "Cerrar" : "Muestra"}
                         </button>`
                      : ""
                  }
                  <a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer" title="Abrir en Spotify"
                     class="w-10 h-10 rounded-full bg-white text-slate-950 flex items-center justify-center shrink-0 shadow hover:scale-105 transition">
                    <span class="ml-0.5 text-sm font-black">▶</span>
                  </a>
                </div>
              </div>

              ${
                showSample && embedUrl
                  ? `<div class="mt-3 pt-3 border-t border-white/15">
                       <iframe src="${escapeHtml(embedUrl)}"
                               width="100%" height="152" frameBorder="0"
                               allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                               loading="lazy"
                               class="rounded-xl w-full bg-slate-950/70"></iframe>
                     </div>`
                  : ""
              }
            </div>
          </div>
        `;
      }

      function renderOverlaysLayerHtml(char, interactive) {
        const overlays = Array.isArray(char.overlays) ? char.overlays : [];
        if (overlays.length === 0) return "";
        const refWidth = getOverlayReferenceWidth();
        return `
          <div class="absolute inset-0 z-20 pointer-events-none overflow-hidden" data-overlay-canvas>
            ${overlays
              .map((ov, index) => {
                const px = Math.max(0, Math.min(100, Number(ov.x) || 50));
                const py = Math.max(0, Math.min(100, Number(ov.y) || 50));
                const baseSize = Math.max(24, Math.min(280, Number(ov.size) || 88));
                const widthPct = Math.max(4, Math.min(65, (baseSize / refWidth) * 100));
                return `
                  <div data-overlay-id="${escapeHtml(ov.id)}"
                       style="left:${px}%; top:${py}%; width:${widthPct.toFixed(2)}%; transform:translate(-50%, -50%);"
                       class="absolute select-none ${interactive ? "pointer-events-auto cursor-grab active:cursor-grabbing group" : ""}">
                    <img src="${escapeHtml(ov.url)}" alt="Adorno ${index + 1}"
                         draggable="false"
                         class="w-full h-auto object-contain block drop-shadow-lg pointer-events-none" />
                    ${
                      interactive
                        ? `<span class="hidden group-hover:flex items-center justify-center w-5 h-5 rounded-full bg-slate-950/85 text-white text-[10px] font-bold border border-white/25 mx-auto mt-1">
                             ${index + 1}
                           </span>`
                        : ""
                    }
                  </div>
                `;
              })
              .join("")}
          </div>
        `;
      }

      function renderCharacterCardDisplay(char, options) {
        const opts = options || {};
        const theme = buildThemeFromCharacter(char);
        const font = getFontById(char.nameFontId);
        const dominant = getDominantEmotion(char.emotions);
        const emotions = Array.isArray(char.emotions) ? char.emotions : [];
        const shape = char.avatarShape || "rounded-square";
        const baseBoxPx = 112;
        const scalePct = Math.max(70, Math.min(145, Number(char.avatarScale) || 100));
        const heartBoost = shape === "heart" ? 1.28 : 1;
        const boxPx = Math.round(((baseBoxPx * scalePct) / 100) * heartBoost);
        const clipCss = getAvatarClipPathCss(shape);

        const cardBgStyle = theme.isSolid
          ? theme.bgStart
          : `linear-gradient(160deg, ${theme.bgStart} 0%, ${theme.bgEnd} 100%)`;

        const bannerBgStyle = theme.isSolid
          ? theme.bgStart
          : `linear-gradient(120deg, ${theme.accent} 0%, ${theme.bgEnd} 100%)`;

        return `
          <article class="relative rounded-3xl overflow-hidden shadow-2xl border transition"
                   style="background:${cardBgStyle}; border-color:${theme.border}; color:${theme.text};">
            ${renderOverlaysLayerHtml(char, Boolean(opts.interactiveOverlays))}

            <div class="relative w-full h-44 sm:h-52 overflow-hidden" style="background:${bannerBgStyle};">
              ${
                char.bannerUrl
                  ? `<img src="${escapeHtml(char.bannerUrl)}" alt="Portada de ${escapeHtml(char.name)}"

                          class="w-full h-full object-cover block" />`
                  : ""
              }
              <div class="absolute inset-0 bg-gradient-to-t from-black/55 via-black/15 to-transparent pointer-events-none"></div>

                <span class="w-2.5 h-2.5 rounded-full inline-block" style="background:${dominant.color || theme.accent}"></span>
                <span>Dominante: ${escapeHtml(dominant.label)} (${escapeHtml(String(dominant.value))}%)</span>
              </div>
            </div>

            <div class="relative p-5 sm:p-7">
              ${
                char.bodyBgUrl
                  ? `<img src="${escapeHtml(char.bodyBgUrl)}" alt="Fondo de tarjeta"
                          style="object-position:${getObjectPositionCss(char.bodyBgPosition)}"
                          class="absolute inset-0 w-full h-full object-cover pointer-events-none" />
                     <div class="absolute inset-0 pointer-events-none"
                          style="background:rgba(9, 13, 26, ${char.bodyBgOverlay ?? 0.68})"></div>`
                  : ""
              }

              <div class="relative z-10">
                <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 -mt-16 sm:-mt-20 mb-5">
                  <div class="flex items-end gap-4 min-w-0">
                    <div style="width:${boxPx}px; height:${boxPx}px; clip-path:${clipCss}; -webkit-clip-path:${clipCss}; background:${theme.surface};"
                         class="overflow-hidden shrink-0 shadow-xl flex items-center justify-center">
                      ${
                        char.avatarUrl
                          ? `<img src="${escapeHtml(char.avatarUrl)}" alt="${escapeHtml(char.name)}"
                                  style="object-position:${getObjectPositionCss(char.avatarPosition)}; transform:scale(${shape === "heart" ? "1.06" : "1"});"
                                  class="w-full h-full object-cover transition-transform" />`
                          : `<span class="text-2xl sm:text-3xl font-extrabold" style="color:${theme.accent}">${escapeHtml(getInitials(char.name))}</span>`
                      }
                    </div>
                    <div class="min-w-0 pt-10 sm:pt-12">
                      ${
                        char.title
                          ? `<span class="inline-block px-2.5 py-0.5 rounded-md text-[11px] font-bold uppercase tracking-wider mb-1"
                                   style="background:${theme.badgeBg}; color:${theme.badgeText}">${escapeHtml(char.title)}</span>`
                          : ""
                      }
                      <h2 class="text-2xl sm:text-4xl leading-tight break-words"
                          style="font-family:${font.css}; font-style:${font.italic ? "italic" : "normal"}; color:${theme.text}">
                        ${escapeHtml(char.name || "Personaje")}
                      </h2>
                    </div>
                  </div>

                  ${
                    opts.showActions !== false
                      ? `<div class="flex flex-wrap items-center gap-2">
                           <button type="button" data-action="open-share-modal"
                                   class="px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-950/65 hover:bg-slate-950/85 text-white border border-white/15 transition cursor-pointer">
                             Compartir Tarjeta
                           </button>
                           ${
                             opts.onEditLabel
                               ? `<button type="button" data-action="switch-to-editor"
                                          class="px-3.5 py-2 rounded-xl text-xs font-bold transition cursor-pointer"
                                          style="background:${theme.accent}; color:#090d1a">
                                    ${escapeHtml(opts.onEditLabel)}
                                  </button>`
                               : ""
                           }
                         </div>`
                      : ""
                  }
                </div>

                ${
                  char.position
                    ? `<div class="mb-4 px-4 py-3 rounded-2xl border-l-4"
                            style="background:${theme.surface}; border-color:${theme.accent}; border-top:1px solid ${theme.border}; border-right:1px solid ${theme.border}; border-bottom:1px solid ${theme.border}">

                           Posición actual: ${escapeHtml(char.position)}

                       </div>`
