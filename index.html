                ${
                  char.description
                    ? `<div class="px-4 py-3.5 rounded-2xl border"

                       </div>`
                    : ""
                }

                ${renderMusicWidgetHtml(char, theme)}

                ${
                  emotions.length > 0
                    ? `<div class="mt-6">

                               return `
                                 <div class="p-4 rounded-2xl border"
                                      style="background:${theme.surface}; border-color:${theme.border}">
                                   <div class="flex items-center justify-between gap-2 mb-2">
                                     <div class="flex items-center gap-2 min-w-0">
                                       <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${col}"></span>
                                       <span class="font-bold text-sm truncate" style="color:${theme.text}">${escapeHtml(emo.label || "Emoción")}</span>
                                     </div>
                                     <span class="font-extrabold text-sm shrink-0" style="color:${col}">${pct}%</span>
                                   </div>
                                   <div class="w-full h-2.5 rounded-full overflow-hidden bg-slate-500/25">
                                     <div class="h-full rounded-full transition-all duration-300" style="width:${pct}%; background:${col}"></div>
                                   </div>
                                   ${
                                     emo.note
                                       ? `<p class="mt-2.5 mb-0 text-xs sm:text-sm leading-relaxed" style="color:${theme.muted}">${escapeHtml(emo.note)}</p>`
                                       : ""
                                   }
                                 </div>
                               `;
                             })
                             .join("")}
                         </div>
                       </div>`
                    : ""
                }

                ${
                  char.tipsWarnings
                    ? `<div class="mt-5 p-4 rounded-2xl border" style="background:${theme.surface}; border-color:${theme.border}">
                         <div class="text-xs font-extrabold uppercase tracking-wider mb-1.5" style="color:${theme.muted}">

                         </div>
                         <p class="m-0 text-xs sm:text-sm leading-relaxed whitespace-pre-line" style="color:${theme.text}">
                           ${escapeHtml(char.tipsWarnings)}
                         </p>
                       </div>`
                    : ""
                }
              </div>
            </div>
          </article>
        `;
      }

      function refreshLivePreviewColumn() {
        const activeChar = getActiveCharacter();
        const previewCol = document.querySelector("section.xl\\:col-span-5");
        if (previewCol && uiState.viewMode === "editor") {
          const animated = hasAnyGif(activeChar);
          previewCol.innerHTML = `
            <div class="flex items-center justify-between px-1">
              <span class="text-xs font-extrabold uppercase tracking-wider text-slate-400">Vista Previa en Vivo</span>

              </span>
            </div>
            ${renderCharacterCardDisplay(activeChar, { showActions: true, onEditLabel: "Pantalla Final", interactiveOverlays: true })}
          `;
        }
      }

      let dragState = null;

      document.addEventListener("pointerdown", (event) => {
        if (uiState.viewMode !== "editor") return;
        const ovEl = event.target.closest("[data-overlay-id]");
        if (!ovEl) return;
        const canvasEl = ovEl.closest("[data-overlay-canvas]");
        if (!canvasEl) return;
        const overlayId = ovEl.getAttribute("data-overlay-id");
        if (!overlayId) return;

        event.preventDefault();
        const rect = canvasEl.getBoundingClientRect();
        dragState = {
          overlayId,
          left: rect.left,
          top: rect.top,
          width: Math.max(1, rect.width),
          height: Math.max(1, rect.height),
          el: ovEl
        };
        if (typeof ovEl.setPointerCapture === "function") {
          try {
            ovEl.setPointerCapture(event.pointerId);
          } catch (_e) {
            // Ignorar
          }
        }
      });

      document.addEventListener("pointermove", (event) => {
        if (!dragState) return;
        const px = Math.max(0, Math.min(100, ((event.clientX - dragState.left) / dragState.width) * 100));
        const py = Math.max(0, Math.min(100, ((event.clientY - dragState.top) / dragState.height) * 100));
        if (dragState.el) {
          dragState.el.style.left = `${px}%`;
          dragState.el.style.top = `${py}%`;
        }
        updateActiveCharacter((c) => {
          c.overlays = (c.overlays || []).map((o) =>
            o.id === dragState.overlayId ? { ...o, x: Math.round(px), y: Math.round(py) } : o
          );
        }, false);
      });

      function finishOverlayDrag() {
        if (!dragState) return;
        dragState = null;
        renderApp();
      }

      document.addEventListener("pointerup", finishOverlayDrag);
      document.addEventListener("pointercancel", finishOverlayDrag);

      document.addEventListener("click", async (event) => {
        const backdrop = event.target.closest("[data-modal-backdrop]");
        if (backdrop && event.target === backdrop) {
          uiState.shareModalOpen = false;
          uiState.accountModalOpen = false;
          renderApp();
          return;
        }

        const actionEl = event.target.closest("[data-action]");
        if (!actionEl) return;
        const action = actionEl.getAttribute("data-action");
        const activeChar = getActiveCharacter();

        if (action === "toggle-spotify-sample") {
          uiState.spotifySampleOpen = !uiState.spotifySampleOpen;
          renderApp();
        } else if (action === "open-share-modal") {
          uiState.shareModalOpen = true;
          renderApp();
        } else if (action === "close-share-modal") {
          uiState.shareModalOpen = false;
          renderApp();
        } else if (action === "open-account-modal") {
          uiState.accountModalOpen = true;
          renderApp();
        } else if (action === "close-account-modal") {
          uiState.accountModalOpen = false;
          renderApp();
        } else if (action === "switch-to-final") {
          uiState.viewMode = "final";
          renderApp();
        } else if (action === "switch-to-editor") {
          uiState.viewMode = "editor";
          renderApp();
        } else if (action === "exit-shared-view") {
          try {
            window.history.replaceState(null, "", window.location.pathname + window.location.search);
          } catch (_e) {
            window.location.hash = "";
          }
          uiState.sharedCharacter = null;
          uiState.viewMode = "editor";
          renderApp();
        } else if (action === "select-character") {
          const charId = actionEl.getAttribute("data-char-id");
          if (charId && appState.characters.some((c) => c.id === charId)) {
            appState.selectedId = charId;
            uiState.spotifySampleOpen = false;
            persistAccountData(appState, false);
            renderApp();
          }
        } else if (action === "create-character") {
          const num = appState.characters.length + 1;
          const newChar = normalizeCharacter(
            {
              id: `char-${Date.now()}`,
              name: `Nuevo Personaje ${num}`,
              title: "Arquetipo Personalizado",
              position: "Compañero de Trama",
              description: "Escribe aquí la historia, motivación o rasgos principales del personaje.",
              themeId: CARD_THEMES[num % CARD_THEMES.length].id,
              nameFontId: NAME_FONTS[num % NAME_FONTS.length].id,
              avatarShape: "rounded-square",
              avatarScale: 100,
              overlays: [],
              emotions: [
                { id: `e-${Date.now()}-1`, label: "Confianza", value: 70, color: "#34d399", note: "" },
                { id: `e-${Date.now()}-2`, label: "Intrigas", value: 55, color: "#a78bfa", note: "" }
              ]
            },
            num
          );
          appState.characters.push(newChar);
          appState.selectedId = newChar.id;
          uiState.spotifySampleOpen = false;
          persistAccountData(appState, false);
          uiState.viewMode = "editor";
          renderApp();
          setNotice(`Se creó ${newChar.name}.`);
        } else if (action === "delete-character") {
          if (appState.characters.length <= 1) return;
          appState.characters = appState.characters.filter((c) => c.id !== activeChar.id);
          appState.selectedId = appState.characters[0].id;
          persistAccountData(appState, false);
          renderApp();
          setNotice("Personaje eliminado.");
        } else if (action === "restore-defaults") {
          const seeded = createDefaultCharacters();
          appState.characters = seeded;
          appState.selectedId = seeded[0].id;
          persistAccountData(appState, true);
          renderApp();
          setNotice("Personajes de ejemplo restaurados.");
        } else if (action === "select-card-theme") {
          const themeId = actionEl.getAttribute("data-theme-id");
          if (themeId) {
            updateActiveCharacter((c) => {
              c.themeId = themeId;
              c.cardColorMode = "gradient";
            });
          }
        } else if (action === "set-card-color-mode") {
          const mode = actionEl.getAttribute("data-mode");
          if (mode && ["gradient", "solid", "custom"].includes(mode)) {
            updateActiveCharacter((c) => {
              c.cardColorMode = mode;
            });
          }
        } else if (action === "select-solid-color") {
          const solidHex = actionEl.getAttribute("data-solid-color");
          const accentHex = actionEl.getAttribute("data-accent-color");
          updateActiveCharacter((c) => {
            c.cardColorMode = "solid";
            if (solidHex) c.solidColor = normalizeHexColor(solidHex, c.solidColor);
            if (accentHex) c.customAccentColor = normalizeHexColor(accentHex, c.customAccentColor);
          });
        } else if (action === "select-avatar-shape") {
          const shape = actionEl.getAttribute("data-shape");
          if (shape && AVATAR_SHAPES.includes(shape)) {
            updateActiveCharacter((c) => {
              c.avatarShape = shape;
            });
          }
        } else if (action === "add-overlay-url") {
          const input = document.getElementById("new-overlay-url-input");
          const rawUrl = (input ? input.value : uiState.newOverlayUrl || "").trim();
          if (!rawUrl) {
            setNotice("Pega primero un enlace de imagen o GIF para colocar sobre la tarjeta.");
            return;
          }
          const count = (activeChar.overlays || []).length;
          const offsetX = Math.min(82, 22 + ((count * 17) % 60));
          const offsetY = Math.min(82, 24 + ((count * 19) % 58));
          updateActiveCharacter((c) => {
            c.overlays = [
              ...(c.overlays || []),
              { id: `ovl-${Date.now()}-${count}`, url: rawUrl, x: offsetX, y: offsetY, size: uiState.newOverlaySize || 88 }
            ];
          }, false);
          uiState.newOverlayUrl = "";
          renderApp();
          setNotice("Elemento añadido sobre la tarjeta.");
        } else if (action === "remove-overlay") {
          const ovId = actionEl.getAttribute("data-overlay-id");
          updateActiveCharacter((c) => {
            c.overlays = (c.overlays || []).filter((o) => o.id !== ovId);
          });
        } else if (action === "clear-media") {
          const target = actionEl.getAttribute("data-target");
          if (target) {
            updateActiveCharacter((c) => {
              c[target] = "";
            });
          }
        } else if (action === "add-emotion") {
          updateActiveCharacter((c) => {
            const idx = c.emotions.length;
            c.emotions.push({
              id: `emo-${Date.now()}-${idx}`,
              label: `Emoción ${idx + 1}`,
              value: 50,
              color: EMOTION_COLORS[idx % EMOTION_COLORS.length],
              note: ""
            });
          });
        } else if (action === "remove-emotion") {
          const emoId = actionEl.getAttribute("data-emo-id");
          updateActiveCharacter((c) => {
            if (c.emotions.length > 1) {
              c.emotions = c.emotions.filter((e) => e.id !== emoId);
            }
          });
        } else if (action === "select-emo-color") {
          const emoId = actionEl.getAttribute("data-emo-id");
          const color = actionEl.getAttribute("data-color");
          updateActiveCharacter((c) => {
            c.emotions = c.emotions.map((e) => (e.id === emoId ? { ...e, color } : e));
          });
        } else if (action === "copy-share-link") {
          const shareInput = document.getElementById("share-link-input");
          await copyShareLink(activeChar, shareInput);
        } else if (action === "export-card") {
          await handleExportCard(activeChar);
        } else if (action === "switch-account") {
          const acc = actionEl.getAttribute("data-account");
          if (acc) {
            persistAccountData(appState, false);
            globalMeta.currentAccount = acc;
            saveGlobalMeta(globalMeta);
            appState = loadAccountData(acc);
            renderApp();
            setNotice(`Cuenta activa: ${acc}`);
          }
        } else if (action === "create-account") {
          const input = document.getElementById("new-account-input");
          const name = input ? input.value.trim() : "";
          if (!name) return;
          if (!globalMeta.accounts.includes(name)) globalMeta.accounts.push(name);
          globalMeta.currentAccount = name;
          saveGlobalMeta(globalMeta);
          appState = createDefaultAccountState(name);
          persistAccountData(appState, true);
          renderApp();
          setNotice(`Cuenta "${name}" creada.`);
        } else if (action === "export-json") {
          const dump = JSON.stringify({ exportedAt: new Date().toISOString(), account: appState }, null, 2);
          const blob = new Blob([dump], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `respaldo-${(appState.accountName || "cuenta").toLowerCase().replace(/[^a-z0-9]+/g, "-")}.json`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.setTimeout(() => URL.revokeObjectURL(url), 4000);
          setNotice("Respaldo JSON exportado.");
        }
      });

      document.addEventListener("input", async (event) => {
        const el = event.target;
        if (el.id === "new-overlay-url-input") {
          uiState.newOverlayUrl = el.value;
          return;
        }

        const ovField = el.getAttribute("data-ov-field");
        const ovId = el.getAttribute("data-overlay-id");
        if (ovField && ovId) {
          const numVal = Number(el.value);
          updateActiveCharacter((c) => {
            c.overlays = (c.overlays || []).map((o) => {
              if (o.id !== ovId) return o;
              if (ovField === "x") return { ...o, x: Math.max(0, Math.min(100, isNaN(numVal) ? 50 : numVal)) };
              if (ovField === "y") return { ...o, y: Math.max(0, Math.min(100, isNaN(numVal) ? 50 : numVal)) };
              if (ovField === "size") return { ...o, size: Math.max(24, Math.min(280, isNaN(numVal) ? 88 : numVal)) };
              return o;
            });
          }, false);
          const rowEl = el.closest("[data-ov-row]");
          const labelSpan = rowEl && rowEl.querySelector("label span");
          if (labelSpan) {
            if (ovField === "x") labelSpan.textContent = `Horizontal (X): ${Math.round(numVal)}%`;
            if (ovField === "y") labelSpan.textContent = `Vertical (Y): ${Math.round(numVal)}%`;
            if (ovField === "size") labelSpan.textContent = `Tamaño: ${Math.round(numVal)}px`;
          }
          refreshLivePreviewColumn();
          return;
        }

        const field = el.getAttribute("data-field");
        if (field) {
          updateActiveCharacter((c) => {
            if (field === "bodyBgOverlay") {
              c.bodyBgOverlay = Number(el.value) || 0.68;
            } else if (field === "avatarScale") {
              c.avatarScale = Math.max(70, Math.min(145, Math.round(Number(el.value) || 100)));
            } else {
              c[field] = el.value;
            }
          }, false);

          if (field === "avatarScale") {
            const scaleLabel = document.querySelector("[data-avatar-scale-label]");
            if (scaleLabel) {
              scaleLabel.textContent = `${Math.max(70, Math.min(145, Math.round(Number(el.value) || 100)))}%`;
            }
          }

          const activeChar = getActiveCharacter();
          refreshLivePreviewColumn();

          const font = getFontById(activeChar.nameFontId);
          const namePreviewSpan = document.querySelector(".p-3.rounded-2xl.bg-slate-900\\/70 span.truncate");
          if (namePreviewSpan) {
            namePreviewSpan.style.fontFamily = font.css;
            namePreviewSpan.style.fontStyle = font.italic ? "italic" : "normal";
            namePreviewSpan.textContent = activeChar.name || "Personaje";
          }

          if (field === "spotifyUrl") {
            const meta = await lookupSpotifyMetadata(el.value, false);
            if (meta && (meta.title || meta.artist || meta.cover)) {
              const charIdx = appState.characters.findIndex((item) => item.id === activeChar.id);
              if (charIdx !== -1) {
                const cur = appState.characters[charIdx];
                appState.characters[charIdx] = normalizeCharacter(
                  {
                    ...cur,
                    spotifyTitle: meta.title || cur.spotifyTitle,
                    spotifyArtist: meta.artist || cur.spotifyArtist,
                    spotifyCover: meta.cover || cur.spotifyCover
                  },
                  charIdx
                );
                persistAccountData(appState, false);
                const titleInput = document.querySelector('input[data-field="spotifyTitle"]');
                const artistInput = document.querySelector('input[data-field="spotifyArtist"]');
                const coverInput = document.querySelector('input[data-field="spotifyCover"]');
                if (titleInput && meta.title) titleInput.value = meta.title;
                if (artistInput && meta.artist) artistInput.value = meta.artist;
                if (coverInput && meta.cover) coverInput.value = meta.cover;
                refreshLivePreviewColumn();
              }
            }
          }
          return;
        }

        const emoField = el.getAttribute("data-emo-field");
        const emoId = el.getAttribute("data-emo-id");
        if (emoField && emoId) {
          updateActiveCharacter((c) => {
            c.emotions = c.emotions.map((e) => {
              if (e.id !== emoId) return e;
              if (emoField === "value") {
                return { ...e, value: Math.max(0, Math.min(100, Number(el.value) || 0)) };
              }
              return { ...e, [emoField]: el.value };
            });
          }, false);

          if (emoField === "value") {
            const pctSpan = el.parentElement && el.parentElement.querySelector("span");
            if (pctSpan) pctSpan.textContent = `${Math.max(0, Math.min(100, Number(el.value) || 0))}%`;
          }

          refreshLivePreviewColumn();
        }
      });

      document.addEventListener("change", async (event) => {
        const el = event.target;
        const action = el.getAttribute("data-action");

        if (action === "change-page-theme") {
          appState.pageThemeId = el.value;
          persistAccountData(appState, false);
          renderApp();
          return;
        }

        if (action === "toggle-autosave") {
          appState.autoSave = Boolean(el.checked);
          persistAccountData(appState, true);
          renderApp();
          return;
        }

        if (action === "import-json-file" && el.files && el.files[0]) {
          try {
            const text = await readFileAsDataUrl(el.files[0]);
            const base64Part = text.split(",")[1] || "";
            const decoded = new TextDecoder().decode(Uint8Array.from(atob(base64Part), (ch) => ch.charCodeAt(0)));
            const parsed = JSON.parse(decoded);
            const accSource = parsed && parsed.account ? parsed.account : parsed;
            if (accSource && Array.isArray(accSource.characters) && accSource.characters.length > 0) {
              const chars = accSource.characters.map((c, i) => normalizeCharacter(c, i));
              appState.characters = chars;
              appState.selectedId = chars[0].id;
              if (CARD_THEMES.some((t) => t.id === accSource.pageThemeId)) {
                appState.pageThemeId = accSource.pageThemeId;
              }
              persistAccountData(appState, true);
              renderApp();
              setNotice("Respaldo JSON importado correctamente.");
            } else {
              setNotice("El archivo JSON no contiene personajes válidos.");
            }
          } catch (_err) {
            setNotice("No se pudo leer el archivo JSON.");
          }
          return;
        }

        const uploadTarget = el.getAttribute("data-upload");
        if (uploadTarget && el.files && el.files[0]) {
          const file = el.files[0];
          try {
            const dataUrl = await readFileAsDataUrl(file);
            if (uploadTarget === "overlay") {
              const currentChar = getActiveCharacter();
              const count = (currentChar.overlays || []).length;
              const offsetX = Math.min(82, 22 + ((count * 17) % 60));
              const offsetY = Math.min(82, 24 + ((count * 19) % 58));
              updateActiveCharacter((c) => {
                c.overlays = [
                  ...(c.overlays || []),
                  { id: `ovl-${Date.now()}-${count}`, url: dataUrl, x: offsetX, y: offsetY, size: uiState.newOverlaySize || 88 }
                ];
              });
              setNotice(file.type === "image/gif" ? "GIF añadido sobre la tarjeta." : "Imagen añadida sobre la tarjeta.");
            } else {
              updateActiveCharacter((c) => {
                c[uploadTarget] = dataUrl;
              });
              setNotice(file.type === "image/gif" ? "GIF cargado correctamente." : "Imagen cargada correctamente.");
            }
          } catch (_err) {
            setNotice("No se pudo cargar el archivo seleccionado.");
          }
        }
      });

      window.addEventListener("hashchange", () => {
        const shared = decodeShareFromHash();
        if (shared) {
          uiState.sharedCharacter = shared;
          uiState.viewMode = "shared";
        } else if (uiState.viewMode === "shared") {
          uiState.sharedCharacter = null;
          uiState.viewMode = "editor";
        }
        renderApp();
      });

      if (sharedCharacterFromUrl) {
        uiState.sharedCharacter = sharedCharacterFromUrl;
        uiState.viewMode = "shared";
      }

      renderApp();
    })();
  </script>
